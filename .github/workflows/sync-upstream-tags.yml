name: Sync upstream BuildKit tags

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream-buildkit-tags
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      count: ${{ steps.tags.outputs.count }}
      tags: ${{ steps.tags.outputs.tags }}
      unpatched-lines: ${{ steps.tags.outputs.unpatched-lines }}
    steps:
      - name: Checkout RunsOn BuildKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Discover new upstream tags
        id: tags
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/moby/buildkit.git
          git fetch --force --no-tags upstream \
            'refs/tags/v*:refs/upstream-tags/v*'
          git fetch --force --tags origin

          sync_after_tag="$(<.github/buildkit-patches/sync-after-tag)"
          sync_after_epoch="$(git for-each-ref \
            --format='%(creatordate:unix)' \
            "refs/upstream-tags/${sync_after_tag}")"
          if [[ -z "${sync_after_epoch}" ]]; then
            echo "Cannot resolve sync baseline ${sync_after_tag}" >&2
            exit 1
          fi

          missing_tags=()
          unpatched_lines=()
          while IFS=$'\t' read -r created_epoch upstream_tag; do
            if (( created_epoch <= sync_after_epoch )); then
              continue
            fi
            # Only final releases: release candidates are not published.
            if [[ ! "${upstream_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            runs_on_tag="${upstream_tag}-runs-on.1"
            if git show-ref --verify --quiet "refs/tags/${runs_on_tag}"; then
              continue
            fi
            # A release line without a patch set is reported instead of
            # failing every day; adding its patch set picks the tag up.
            version_line="${upstream_tag%.*}"
            if [[ ! -d ".github/buildkit-patches/${version_line}" ]]; then
              echo "::warning title=No RunsOn patch set::${upstream_tag} is not synced: .github/buildkit-patches/${version_line} does not exist"
              unpatched_lines+=("${version_line}")
              continue
            fi
            missing_tags+=("${upstream_tag}")
          done < <(git for-each-ref \
            --sort=creatordate \
            --format='%(creatordate:unix)%09%(refname:strip=2)' \
            refs/upstream-tags/)

          tags_json="$(printf '%s\n' "${missing_tags[@]}" | \
            jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "count=${#missing_tags[@]}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags_json}" >> "${GITHUB_OUTPUT}"
          echo "New upstream tags: ${tags_json}"
          lines_json="$(printf '%s\n' "${unpatched_lines[@]}" | \
            jq -Rsc 'split("\n") | map(select(length > 0)) | unique')"
          echo "unpatched-lines=${lines_json}" >> "${GITHUB_OUTPUT}"
          echo "Release lines without a patch set: ${lines_json}"

  sync:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      # One tag at a time, oldest first, so stable tag promotions don't race.
      max-parallel: 1
      matrix:
        upstream-tag: ${{ fromJSON(needs.discover.outputs.tags) }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/sync-upstream-tag.yml
    with:
      upstream-tag: ${{ matrix.upstream-tag }}

  port:
    needs: discover
    if: needs.discover.outputs.unpatched-lines != '[]'
    strategy:
      fail-fast: false
      matrix:
        version-line: ${{ fromJSON(needs.discover.outputs.unpatched-lines) }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/port-patch-set.yml
    with:
      version-line: ${{ matrix.version-line }}
