name: Port RunsOn patch set to a new release line

# When upstream starts a release line that has no patch set, reapply the
# previous line's series to its first release, verify it, and open a pull
# request adding the new directory. Merging that pull request lets the tag sync
# publish the line. A conflict or failed check opens an issue instead.

on:
  workflow_call:
    inputs:
      version-line:
        description: Upstream release line without a patch set, such as v0.34
        required: true
        type: string
      dry-run:
        description: Report the result without opening a pull request or issue
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version-line:
        description: Upstream release line without a patch set, such as v0.34
        required: true
        type: string
      dry-run:
        description: Report the result without opening a pull request or issue
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: port-patch-set-${{ inputs.version-line }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Checkout RunsOn BuildKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the line needs a port
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_LINE: ${{ inputs.version-line }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION_LINE}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release line: ${VERSION_LINE}" >&2
            exit 1
          fi
          patches=.github/buildkit-patches
          skip() {
            echo "${VERSION_LINE}: $1"
            echo "::notice title=Patch set port skipped::${VERSION_LINE}: $1"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if [[ -d "${patches}/${VERSION_LINE}" ]]; then
            skip "a patch set already exists"
          fi

          # Port only from the immediately previous line: an older series may
          # have been dropped on purpose.
          major="${VERSION_LINE#v}"; major="${major%%.*}"
          minor="${VERSION_LINE##*.}"
          if (( minor == 0 )); then
            skip "no previous line to port from"
          fi
          source_line="v${major}.$((minor - 1))"
          if ! compgen -G "${patches}/${source_line}/*.patch" >/dev/null; then
            skip "${source_line} has no patch set to port from"
          fi

          # The branch stays while its pull request is open, and after it is
          # declined: deleting the branch allows another port.
          branch="patch-set/${VERSION_LINE}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            skip "branch ${branch} already exists"
          fi
          title="Port the RunsOn patch set to ${VERSION_LINE}"
          if gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
              --search "in:title \"${title}\"" --json title --jq '.[].title' |
              grep -Fxq "${title}"; then
            skip "issue \"${title}\" is open"
          fi
          # A patch set proposed by hand, like a review PR, takes precedence.
          for number in $(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
              --json number --jq '.[].number'); do
            if gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${number}/files" \
                --jq '.[].filename' |
                grep -q "^${patches}/${VERSION_LINE}/"; then
              skip "open pull request #${number} already adds ${patches}/${VERSION_LINE}"
            fi
          done

          echo "proceed=true" >> "${GITHUB_OUTPUT}"
          echo "source-line=${source_line}" >> "${GITHUB_OUTPUT}"

      - name: Apply the previous line's series
        id: apply
        if: steps.check.outputs.proceed == 'true'
        env:
          VERSION_LINE: ${{ inputs.version-line }}
          SOURCE_LINE: ${{ steps.check.outputs.source-line }}
        run: |
          set -euo pipefail

          out="${RUNNER_TEMP}/port"
          worktree="${out}/worktree"
          mkdir -p "${out}/patches"
          report="${out}/report.md"

          git remote add upstream https://github.com/moby/buildkit.git
          git fetch --force --no-tags upstream \
            'refs/tags/v*:refs/upstream-tags/v*'
          mapfile -t line_tags < <(git for-each-ref \
              --format='%(refname:strip=2)' "refs/upstream-tags/${VERSION_LINE}.*" |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          if (( ${#line_tags[@]} == 0 )); then
            echo "No final ${VERSION_LINE} release upstream" >&2
            exit 1
          fi
          base_tag="${line_tags[0]}"
          printf '%s\n' "${line_tags[@]}" > "${out}/line-tags"
          echo "${base_tag}" > "${out}/base-tag"

          git worktree add --detach "${worktree}" "refs/upstream-tags/${base_tag}"
          git -C "${worktree}" config user.name "RunsOn BuildKit Bot"
          git -C "${worktree}" config user.email \
            "github-actions[bot]@users.noreply.github.com"

          {
            echo "Ports the \`${SOURCE_LINE}\` patch set to \`${VERSION_LINE}\`, applied to \`${base_tag}\`."
            echo
            echo "### Patches"
            echo
          } > "${report}"

          status=applied
          for patch in ".github/buildkit-patches/${SOURCE_LINE}"/*.patch; do
            name="$(basename "${patch}")"
            # A patch cherry-picked from upstream is dropped once the release
            # contains the original commit.
            picked="$(sed -nE 's/^\(cherry picked from commit ([0-9a-f]{7,40})\)$/\1/p' \
              "${patch}" | head -n 1)"
            if [[ -n "${picked}" ]] &&
                git -C "${worktree}" merge-base --is-ancestor "${picked}" HEAD 2>/dev/null; then
              echo "- dropped \`${name}\`: upstream ${picked:0:12} is in ${base_tag}" >> "${report}"
              continue
            fi
            if git -C "${worktree}" am --3way "${GITHUB_WORKSPACE}/${patch}" > "${out}/am.log" 2>&1; then
              echo "- applied \`${name}\`" >> "${report}"
              continue
            fi
            if grep -q 'No changes -- Patch already applied' "${out}/am.log"; then
              git -C "${worktree}" am --skip
              echo "- dropped \`${name}\`: its changes are already in ${base_tag}" >> "${report}"
              continue
            fi
            git -C "${worktree}" am --abort
            status=conflict
            {
              echo "- **conflict** in \`${name}\`:"
              echo
              echo '```'
              tail -n 40 "${out}/am.log"
              echo '```'
            } >> "${report}"
            break
          done

          if [[ "${status}" == applied ]]; then
            if [[ -z "$(git -C "${worktree}" rev-list "refs/upstream-tags/${base_tag}..HEAD")" ]]; then
              status=empty
              echo >> "${report}"
              echo "Every patch is already upstream: the line needs no patch set." >> "${report}"
            else
              git -C "${worktree}" format-patch -q \
                "refs/upstream-tags/${base_tag}..HEAD" -o "${out}/patches"
            fi
          fi
          echo "${status}" > "${out}/status"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        if: steps.apply.outputs.status == 'applied'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/port/worktree/go.mod
          cache: false

      - name: Set up Docker Buildx
        if: steps.apply.outputs.status == 'applied'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Verify the ported series
        if: steps.apply.outputs.status == 'applied'
        run: |
          set -uo pipefail

          out="${RUNNER_TEMP}/port"
          worktree="${out}/worktree"
          report="${out}/report.md"
          base_tag="$(<"${out}/base-tag")"
          status=ported
          check() { # description, command...
            local description="$1"
            shift
            echo "::group::${description}"
            if "$@"; then
              echo "- passed: ${description}" >> "${report}"
            else
              echo "- **failed**: ${description}" >> "${report}"
              status=failed
            fi
            echo "::endgroup::"
          }

          echo -e "\n### Checks\n" >> "${report}"
          cd "${worktree}"
          packages="$(git diff --name-only "refs/upstream-tags/${base_tag}..HEAD" -- '*.go' |
            grep -v '^vendor/' | xargs -r -n 1 dirname | sort -u | sed 's|^|./|' | tr '\n' ' ')"

          check "\`go build ./...\`" go build ./...
          if [[ -n "${packages}" ]]; then
            check "unit tests of the patched packages (${packages% })" \
              env TESTPKGS="${packages}" TESTFLAGS="-v -skip Integration" ./hack/test integration
          fi
          check "cache integration tests (oci worker)" \
            env TESTPKGS=./client \
              TESTFLAGS='-v -run ^TestIntegration$/Cache/^worker=oci$' \
              ./hack/test integration

          # The tag sync applies the series to every release of the line.
          while read -r tag; do
            [[ "${tag}" == "${base_tag}" ]] && continue
            target="${out}/am-${tag}"
            git worktree add -q --detach "${target}" "refs/upstream-tags/${tag}"
            git -C "${target}" config user.name "RunsOn BuildKit Bot"
            git -C "${target}" config user.email "github-actions[bot]@users.noreply.github.com"
            check "the series applies to \`${tag}\`" git -C "${target}" am -q "${out}"/patches/*.patch
            git worktree remove --force "${target}"
          done < "${out}/line-tags"

          echo "${status}" > "${out}/status"

      - name: Report result
        id: result
        if: always() && steps.check.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/port"
          status="$(cat "${out}/status" 2>/dev/null || echo failed)"
          if [[ "${status}" == applied ]]; then
            # The checks did not run to completion.
            status=failed
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          if [[ -f "${out}/report.md" ]]; then
            cat "${out}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the ported series
        if: always() && steps.check.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: port-${{ inputs.version-line }}
          path: |
            ${{ runner.temp }}/port/report.md
            ${{ runner.temp }}/port/patches/
          if-no-files-found: ignore

  propose:
    needs: port
    if: >-
      always() && !inputs.dry-run &&
      contains(fromJSON('["ported", "empty", "conflict", "failed"]'), needs.port.outputs.status)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout RunsOn BuildKit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the ported series
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: port-${{ inputs.version-line }}
          path: ${{ runner.temp }}/port

      - name: Open a pull request or an issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.port.outputs.status }}
          VERSION_LINE: ${{ inputs.version-line }}
        run: |
          set -euo pipefail

          report="${RUNNER_TEMP}/port/report.md"
          if [[ "${STATUS}" != ported ]]; then
            {
              cat "${report}"
              echo
              echo "Port the series by hand, add it under \`.github/buildkit-patches/${VERSION_LINE}/\`, then close this issue. The daily sync warns about ${VERSION_LINE} releases until then."
              echo
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > "${RUNNER_TEMP}/issue.md"
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "Port the RunsOn patch set to ${VERSION_LINE}" \
              --body-file "${RUNNER_TEMP}/issue.md"
            exit 0
          fi

          branch="patch-set/${VERSION_LINE}"
          dir=".github/buildkit-patches/${VERSION_LINE}"
          git switch -c "${branch}"
          mkdir -p "${dir}"
          cp "${RUNNER_TEMP}/port/patches/"*.patch "${dir}/"
          git config user.name "RunsOn BuildKit Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${dir}"
          git commit -q -m "patches: port the patch set to ${VERSION_LINE}"
          gh auth setup-git
          git push origin "${branch}"
          {
            echo "**Merging this publishes images**: the daily tag sync applies the series to every ${VERSION_LINE} release and publishes it."
            echo
            cat "${report}"
            echo
            echo "Opened by the tag sync ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Pull request checks do not start for pull requests opened by GitHub Actions; the checks above ran in that run."
          } > "${RUNNER_TEMP}/pr.md"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "patches: port the patch set to ${VERSION_LINE}" \
            --body-file "${RUNNER_TEMP}/pr.md"
