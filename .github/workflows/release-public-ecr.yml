name: Release BuildKit to public ECR

on:
  push:
    tags:
      - "v*-runs-on.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing RunsOn Git tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Existing RunsOn Git tag to publish
        required: true
        type: string

concurrency:
  group: buildkit-public-ecr-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?-runs-on\.[0-9]+$ ]]; then
            echo "Invalid RunsOn release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::966509368716:role/RunsOnGithubReleaseRole
          role-session-name: buildkit-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: buildkit
          platforms: linux/amd64,linux/arm64
          push: true
          tags: public.ecr.aws/c5h5o9k1/runs-on/buildkit:${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=buildkit-release
          cache-to: type=gha,mode=max,scope=buildkit-release
          provenance: mode=max
          sbom: true

